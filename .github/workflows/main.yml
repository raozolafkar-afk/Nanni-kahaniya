
name: Build Nanni Kahaniyan APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -q nanni-kahaniyan-android-project.zip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p kids-story-android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nanni-Kahaniyan-APK
          path: kids-story-android/app/build/outputs/apk/debug/app-debug.apk
          
